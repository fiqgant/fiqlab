    .b1-out {
      font-size: 30px;

      color: #ffb000;
      text-shadow: 0 0 10px rgba(255, 176, 0, 0.6), 0 0 20px rgba(255, 176, 0, 0.3);

  </style>

  <div id="root" data-composition-id="01-boot" data-width="1080" data-height="1920" data-duration="5">
    <div class="b1-bg clip" data-start="0" data-duration="5" data-track-index="0" id="b1-bg-t0"></div>

    <div class="b1-cmdline b1-pad b1-pline clip" data-start="0" data-duration="5" data-track-index="1" id="b1-cmdline-t1" style="top: 380px;"><span class="b1-host">visitor@fiqlab:~$ </span><span class="b1-cmd" id="b1-cmd"></span><span class="b1-cur" id="b1-curCmd"></span></div>

    <div class="b1-out b1-pad clip" data-start="0" data-duration="5" data-track-index="2" id="b1-out-t2" style="top: 470px;"><span class="b1-o" id="b1-l1">Taufiqurrahman &mdash; <span class="b1-amber">Researcher</span></span><span class="b1-o" id="b1-l2">computer vision &middot; deep learning &middot; IoT on the edge</span><span class="b1-o b1-dim" id="b1-l3">fiqlab.dev</span></div>

    <div class="b1-idle b1-pad b1-pline clip" data-start="0" data-duration="5" data-track-index="3" id="b1-idle-t3" style="top: 800px;"><span class="b1-host">visitor@fiqlab:~$ </span><span class="b1-cur" id="b1-curIdle" style="opacity: 0;"></span></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    (function () {
      var DUR = 5;
      var ENTER = 1.85;
      var tl = gsap.timeline({ paused: true });

      var cmdEl = document.getElementById("b1-cmd");
      var curCmd = document.getElementById("b1-curCmd");
      var curIdle = document.getElementById("b1-curIdle");
      var CMD = "whoami";

      var d = { i: 0 };
      tl.to(d, {
        i: CMD.length, duration: 1.1, ease: "none",
        onUpdate: function () { cmdEl.textContent = CMD.slice(0, Math.round(d.i)); }
      }, 0.7);

      var lines = ["#b1-l1", "#b1-l2", "#b1-l3"];
      for (var k = 0; k < lines.length; k++) {
        tl.fromTo(lines[k], { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 1.9 + k * 0.22);
      }

      var CYC = Math.max(1, Math.round(DUR / 0.9));
      var bd = { p: 0 };
      tl.to(bd, {
        p: CYC * Math.PI * 2, duration: DUR, ease: "none",
        onUpdate: function () {
          var t = tl.time();
          var on = Math.sin(bd.p) > 0 ? "1" : "0";
          curCmd.style.opacity = t < ENTER ? on : "0";
          curIdle.style.opacity = t >= ENTER ? on : "0";
        }
      }, 0);

      window.__timelines["01-boot"] = tl;
    })();
  </script>
