  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    (function () {
      var DUR = 5;
      var tl = gsap.timeline({ paused: true });

      var cmdEl = document.getElementById("b5-cmd");
      var curCmd = document.getElementById("b5-curCmd");
      var curBig = document.getElementById("b5-curBig");
      var CMD = "open fiqlab.dev";

      var d = { i: 0 };
      tl.to(d, {
        i: CMD.length, duration: 1.05, ease: "none",
        onUpdate: function () { cmdEl.textContent = CMD.slice(0, Math.round(d.i)); }
      }, 0.4);

      tl.to("#b5-clearwrap", { opacity: 0, duration: 0.12, ease: "none" }, 1.5);

      tl.fromTo("#b5-url",
        { opacity: 0, scale: 0.96 },
        { opacity: 1, scale: 1, duration: 0.34, ease: "power3.out", transformOrigin: "50% 50%" },
        2.0);
      tl.fromTo("#b5-url",
        { textShadow: "0 0 0px rgba(0,212,255,0)" },
        { textShadow: "0 0 12px rgba(0,212,255,0.5), 0 0 24px rgba(0,212,255,0.2)", duration: 0.24, ease: "power2.out" },
        2.0);
      tl.fromTo("#b5-sub", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 2.3);

      var CYC = Math.max(1, Math.round(DUR / 0.9));
      var bd = { p: 0 };
      tl.to(bd, {
        p: CYC * Math.PI * 2, duration: DUR, ease: "none",
        onUpdate: function () {
          var t = tl.time();
          var on = Math.sin(bd.p) > 0 ? "1" : "0";
          curCmd.style.opacity = t < 1.5 ? on : "0";
          curBig.style.opacity = t >= 2.0 ? on : "0";
        }
      }, 0);

      window.__timelines["05-close-url"] = tl;
    })();
  </script>
