  <script>
    window.__timelines = window.__timelines || {};
    (function () {
      var DUR = 5.5;
      var ENTER = 1.75;
      var tl = gsap.timeline({ paused: true });

      var cmdEl = document.getElementById("b2-cmd");
      var curCmd = document.getElementById("b2-curCmd");
      var curIdle = document.getElementById("b2-curIdle");
      var CMD = "ls research/";

      var d = { i: 0 };
      tl.to(d, {
        i: CMD.length, duration: 1.15, ease: "none",
        onUpdate: function () { cmdEl.textContent = CMD.slice(0, Math.round(d.i)); }
      }, 0.5);

      tl.fromTo("#b2-list", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 1.8);

      var words = document.querySelectorAll("#b2-head .b2-w");
      for (var k = 0; k < words.length; k++) {
        tl.fromTo(words[k], { opacity: 0, filter: "blur(8px)", y: 8 }, { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.24, ease: "power3.out" }, 2.9 + k * 0.11);
      }
      tl.fromTo("#b2-head",
        { textShadow: "0 0 0px rgba(0,212,255,0)" },
        { textShadow: "0 0 12px rgba(0,212,255,0.5), 0 0 24px rgba(0,212,255,0.2)", duration: 0.22, ease: "power2.out" },

      tl.fromTo(["#b2-f1", "#b2-u1"], { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.32, ease: "power3.out", stagger: 0.08 }, 4.0);

      var CYC = Math.max(1, Math.round(DUR / 0.9));
      var bd = { p: 0 };
      tl.to(bd, {
        p: CYC * Math.PI * 2, duration: DUR, ease: "none",
        onUpdate: function () {
          var t = tl.time();
          var on = Math.sin(bd.p) > 0 ? "1" : "0";
          curCmd.style.opacity = t < ENTER ? on : "0";
          curIdle.style.opacity = t >= 4.6 ? on : "0";
        }
      }, 0);

      window.__timelines["02-research"] = tl;
    })();
