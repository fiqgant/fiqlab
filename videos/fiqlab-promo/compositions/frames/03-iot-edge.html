  <script>
    window.__timelines = window.__timelines || {};
    (function () {
      var DUR = 5;
      var ENTER = 1.6;
      var tl = gsap.timeline({ paused: true });

      var cmdEl = document.getElementById("b3-cmd");
      var curCmd = document.getElementById("b3-curCmd");
      var curIdle = document.getElementById("b3-curIdle");
      var CMD = "cat iot/projects.md";

      var d = { i: 0 };
      tl.to(d, {
        i: CMD.length, duration: 1.2, ease: "none",
        onUpdate: function () { cmdEl.textContent = CMD.slice(0, Math.round(d.i)); }
      }, 0.4);

      tl.fromTo("#b3-panel", { opacity: 0, y: 14, scale: 0.985 }, { opacity: 1, y: 0, scale: 1, duration: 0.34, ease: "power3.out", transformOrigin: "50% 0%" }, 1.6);

      var rows = ["#b3-r1", "#b3-r2", "#b3-r3", "#b3-r4"];
      for (var k = 0; k < rows.length; k++) {
        tl.fromTo(rows[k], { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.24, ease: "power3.out" }, 1.8 + k * 0.24);
      }

      tl.fromTo("#b3-head", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 3.4);
      tl.fromTo("#b3-head",
        { textShadow: "0 0 0px rgba(0,212,255,0)" },
        { textShadow: "0 0 12px rgba(0,212,255,0.5), 0 0 24px rgba(0,212,255,0.2)", duration: 0.22, ease: "power2.out" },
        3.5);

      var CYC = Math.max(1, Math.round(DUR / 0.9));
      var bd = { p: 0 };
      tl.to(bd, {
        p: CYC * Math.PI * 2, duration: DUR, ease: "none",
        onUpdate: function () {
          var t = tl.time();
          var on = Math.sin(bd.p) > 0 ? "1" : "0";
          curCmd.style.opacity = t < ENTER ? on : "0";
          curIdle.style.opacity = t >= 4.1 ? on : "0";
        }
      }, 0);

      window.__timelines["03-iot-edge"] = tl;
    })();
