name: Scholar Sync

on:
  schedule:
    # Every Sunday at 00:00 UTC
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Sync Google Scholar Data
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Reuse lib/ fetchers so the cache schema always matches what the pages read.
      - name: Sync Scholar + GitHub caches
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          GOOGLE_SCHOLAR_AUTHOR_ID: ${{ secrets.GOOGLE_SCHOLAR_AUTHOR_ID }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: |
          node --experimental-strip-types --no-warnings --input-type=module -e '
            const s = await import("./lib/scholar.ts");
            const g = await import("./lib/github.ts");
            const sc = await s.fetchScholarData(process.env.GOOGLE_SCHOLAR_AUTHOR_ID, process.env.SERPAPI_KEY);
            await s.saveScholarCache(sc);
            console.log(`Synced ${sc.articles.length} articles`);
            const gh = await g.fetchGitHubData(process.env.GH_USERNAME);
            await g.saveGitHubCache(gh);
            console.log(`Synced ${gh.repos.length} repos`);
          '

      - name: Commit updated cache
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: sync scholar + github cache [skip ci]"
          file_pattern: data/scholar-cache.json data/github-cache.json
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
